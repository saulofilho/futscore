<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="ballGrad192" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141618"/>
      <stop offset="100%" stop-color="#0b0c0d"/>
    </linearGradient>
    <filter id="neonGlow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00ff88" flood-opacity="0.85"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="#00ff88" stroke-width="2.5" opacity="0.4"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="96" cy="96" r="66" fill="#0b0c0d" stroke="#00ff88" stroke-width="4" filter="url(#neonGlow192)"/>
  
  <!-- Soccer Ball Body -->
  <circle cx="96" cy="96" r="54" fill="url(#ballGrad192)"/>
  
  <!-- Center Pentagon -->
  <polygon points="96,75 110,85 105,102 87,102 82,85" fill="#141618"/>
  
  <!-- Edge Patches -->
  <polygon points="96,43 103,54 89,54" fill="#141618"/>
  <polygon points="135,66 128,78 140,82 145,71" fill="#141618"/>
  <polygon points="131,123 122,117 127,130 138,130" fill="#141618"/>
  <polygon points="61,123 70,117 65,130 54,130" fill="#141618"/>
  <polygon points="57,66 64,78 52,82 47,71" fill="#141618"/>
  
  <!-- Seam Lines -->
  <line x1="96" y1="75" x2="96" y2="54" stroke="#141618" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="85" x2="128" y2="78" stroke="#141618" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="102" x2="122" y2="117" stroke="#141618" stroke-width="3" stroke-linecap="round"/>
  <line x1="87" y1="102" x2="70" y2="117" stroke="#141618" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="85" x2="64" y2="78" stroke="#141618" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Neon Live Indicator -->
  <circle cx="140" cy="52" r="9" fill="#00ff88" stroke="#0b0c0d" stroke-width="3"/>
  <circle cx="140" cy="52" r="14" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6"/>
