<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1113"/>
      <stop offset="50%" stop-color="#0b0c0d"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00c868"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#greenGlow)"/>

  <!-- Tactical Pitch Lines in Background -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.04" fill="none">
    <rect x="80" y="60" width="1040" height="510" rx="6"/>
    <line x1="600" y1="60" x2="600" y2="570"/>
    <circle cx="600" cy="315" r="90"/>
    <circle cx="600" cy="315" r="4" fill="#ffffff"/>
    <rect x="80" y="180" width="180" height="270"/>
    <rect x="80" y="240" width="70" height="150"/>
    <rect x="940" y="180" width="180" height="270"/>
    <rect x="1050" y="240" width="70" height="150"/>
  </g>

  <!-- Border Accent -->
  <rect x="16" y="16" width="1168" height="598" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Left Side: Brand & Hero Messaging -->
  <g transform="translate(80, 110)">
    <!-- Live Pill -->
    <rect x="0" y="0" width="170" height="34" fill="#141618" stroke="#00ff88" stroke-width="1.5" rx="4"/>
    <circle cx="20" cy="17" r="5" fill="#00ff88"/>
    <text x="34" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00ff88" letter-spacing="2">AO VIVO • DADOS REAIS</text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="'Syne', 'Inter', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1">
      FUT<tspan fill="#00ff88">SCORE</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#ececed" opacity="0.95">
      Futebol em Tempo Real &amp; Central Esportiva
    </text>
    
    <!-- Description -->
    <text x="0" y="210" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#9ca3af" width="500">
      Resultados ao vivo, estatísticas detalhadas, classificação de ligas,
    </text>
    <text x="0" y="235" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#9ca3af">
      mercado da bola, história dos clubes e simulador interativo.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 280)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="36" fill="#141618" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#00ff88">BRASILEIRÃO</text>
      
      <!-- Badge 2 -->
      <rect x="142" y="0" width="150" height="36" fill="#141618" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="156" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#ececed">CHAMPIONS LEAGUE</text>

      <!-- Badge 3 -->
      <rect x="304" y="0" width="140" height="36" fill="#141618" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="318" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#ececed">PREMIER LEAGUE</text>
    </g>
  </g>

  <!-- Right Side: Graphic UI Preview Card (Mockup) -->
  <g transform="translate(680, 95)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect x="0" y="0" width="440" height="440" fill="#141618" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" rx="8"/>
    
    <!-- Card Header -->
    <rect x="0" y="0" width="440" height="48" fill="#0e1012" rx="8"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00ff88">UEFA CHAMPIONS LEAGUE • GRUPO</text>
    <circle cx="410" cy="24" r="4" fill="#00ff88"/>
    <text x="375" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00ff88">78'</text>

    <!-- Match Item 1 -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="400" height="100" fill="#0b0c0d" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      
      <!-- Home -->
      <text x="24" y="44" font-family="'Syne', sans-serif" font-size="18" font-weight="800" fill="#ececed">REAL MADRID</text>
      <text x="24" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af">V. Júnior 34', Bellingham 62'</text>
      
      <!-- Score -->
      <rect x="235" y="28" width="80" height="44" fill="#141618" stroke="#00ff88" stroke-width="1.5"/>
      <text x="275" y="58" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" fill="#00ff88" text-anchor="middle">2 - 1</text>
      
      <!-- Away -->
      <text x="380" y="44" font-family="'Syne', sans-serif" font-size="18" font-weight="800" fill="#ececed" text-anchor="end">MAN. CITY</text>
      <text x="380" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af" text-anchor="end">Haaland 18'</text>
    </g>

    <!-- Match Item 2 -->
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="400" height="100" fill="#0b0c0d" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      
      <!-- Home -->
      <text x="24" y="44" font-family="'Syne', sans-serif" font-size="18" font-weight="800" fill="#ececed">PALMEIRAS</text>
      <text x="24" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af">Estêvão 45+1'</text>
      
      <!-- Score -->
      <rect x="235" y="28" width="80" height="44" fill="#141618" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
      <text x="275" y="58" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" fill="#ececed" text-anchor="middle">1 - 0</text>
      
      <!-- Away -->
      <text x="380" y="44" font-family="'Syne', sans-serif" font-size="18" font-weight="800" fill="#ececed" text-anchor="end">FLAMENGO</text>
      <text x="380" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af" text-anchor="end">Brasileirão Série A</text>
    </g>

    <!-- Market Transfer Snippet in Card -->
    <g transform="translate(20, 302)">
      <rect x="0" y="0" width="400" height="65" fill="#0e1012" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="12" y="14" width="60" height="20" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="1"/>
      <text x="42" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#00ff88" text-anchor="middle">OFICIAL</text>
      <text x="82" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ececed">Mercado da Bola: Mbappé • € 180M</text>
      <text x="14" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af">Últimas movimentações e contratações checadas</text>
    </g>

    <!-- Bottom Action Pill in Mockup -->
    <g transform="translate(20, 385)">
      <rect x="0" y="0" width="400" height="38" fill="#00ff88" rx="4"/>
      <text x="200" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#0b0c0d" text-anchor="middle" letter-spacing="1">ACESSAR FUTSCORE EM TEMPO REAL →</text>
    </g>
  </g>
</svg>
