<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ballGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00ff88" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Ring & Background -->
  <circle cx="32" cy="32" r="30" fill="#0b0c0d" stroke="#00ff88" stroke-width="2.5" filter="url(#neonGlow)"/>
  
  <!-- Soccer Ball Base -->
  <circle cx="32" cy="32" r="23" fill="url(#ballGrad)"/>
  
  <!-- Pentagons and Seams (Classic Soccer Ball) -->
  <!-- Center Pentagon -->
  <polygon points="32,23 38,27.5 35.5,35 28.5,35 26,27.5" fill="#141618"/>
  
  <!-- Top Pentagon / Edge patches -->
  <polygon points="32,9 35,14 29,14" fill="#141618"/>
  <!-- Top Right -->
  <polygon points="49,19 46,24 51,26 53,21" fill="#141618"/>
  <!-- Bottom Right -->
  <polygon points="47,44 43,41 45,47 50,47" fill="#141618"/>
  <!-- Bottom Left -->
  <polygon points="17,44 21,41 19,47 14,47" fill="#141618"/>
  <!-- Top Left -->
  <polygon points="15,19 18,24 13,26 11,21" fill="#141618"/>
  
  <!-- Seam Lines connecting center pentagon to edges -->
  <line x1="32" y1="23" x2="32" y2="14" stroke="#141618" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="27.5" x2="46" y2="24" stroke="#141618" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35.5" y1="35" x2="43" y2="41" stroke="#141618" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28.5" y1="35" x2="21" y2="41" stroke="#141618" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="27.5" x2="18" y2="24" stroke="#141618" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Neon Accent Live Indicator Dot -->
  <circle cx="49" cy="15" r="4" fill="#00ff88" stroke="#0b0c0d" stroke-width="1.5"/>
</svg>
